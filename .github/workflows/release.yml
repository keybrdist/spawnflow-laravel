name: Release

# npm publish via OIDC trusted publishing — no tokens, provenance for free.
# One-time setup per package on npmjs.com (Settings → Trusted Publisher):
#   repository: keybrdist/spawnflow-laravel, workflow: release.yml
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    name: Publish @spawnflow-dx packages

    steps:
      - uses: actions/checkout@v4

      # Node 24 bundles npm >= 11.5.1 (trusted publishing requirement).
      # No registry-url: setup-node would write a placeholder-token .npmrc
      # that shadows OIDC auth.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fallback auth: if an NPM_TOKEN repo secret exists (granular token,
      # publish rights on @spawnflow-dx), use it; otherwise rely on OIDC
      # trusted publishing.
      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            echo "token fallback configured"
          else
            echo "no NPM_TOKEN secret — relying on OIDC trusted publishing"
          fi

      - name: Debug OIDC availability
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "npm $(npm --version) / node $(node --version)"
          npm config get registry

      - name: Install workspace
        working-directory: js
        run: npm install

      - name: Test + typecheck
        working-directory: js
        run: |
          npm test
          npm run typecheck

      # react-shadcn's build resolves @spawnflow-dx/core through the
      # workspace symlink at js/core — its dist/ must exist even when
      # core's publish step is skipped as already-published.
      - name: Build core dist
        working-directory: js/core
        run: npm run build

      # Idempotent: a PHP-only tag must not fail because the JS version
      # already exists — skip instead.
      - name: Publish @spawnflow-dx/core
        working-directory: js/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@spawnflow-dx/core@${VERSION}" version >/dev/null 2>&1; then
            echo "core@${VERSION} already published — skipping"
          else
            npm publish --access public
          fi

      - name: Publish @spawnflow-dx/react-shadcn
        working-directory: js/react-shadcn
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@spawnflow-dx/react-shadcn@${VERSION}" version >/dev/null 2>&1; then
            echo "react-shadcn@${VERSION} already published — skipping"
          else
            npm publish --access public
          fi
